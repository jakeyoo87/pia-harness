name: Release wheel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit("release tag must be vX.Y.Z")
          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit("release tag does not match pyproject.toml version")
          PY

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" "$wheel" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Wheel SHA-256: ${digest} ($(basename "$wheel"))"
