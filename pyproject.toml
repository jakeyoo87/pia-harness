[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pia-harness"
version = "0.2.0"
description = "Minimal multi-user conversation harness for PIA"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
